<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123e36">
  <meta name="description" content="Portal OSIS untuk informasi kegiatan, pengurus, berita, dan aspirasi siswa.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>OSIS | Satu Ruang Bersama</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #f6f8f7; color: #173f37; }
    main { padding: 24px; text-align: center; }
    h1 { font-size: clamp(22px, 4vw, 30px); }
    p { line-height: 1.65; }
    a { color: #123e36; font-weight: 600; }
    a:focus-visible { outline: 3px solid #b37808; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Membuka website OSIS…</h1>
    <p>Jika belum terbuka, <a id="direct" target="_top" href="https://script.google.com/macros/s/AKfycbxKRY-9NiCG-eslWXt519gpSE2tHkXYftcgsv_qi3H2lTrMU6kncHm8UaOIfAFv57G4/exec">buka website OSIS langsung</a>.</p>
    <noscript><p>Klik tautan di atas untuk membuka website OSIS.</p></noscript>
  </main>
  <script>
    "use strict";

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxKRY-9NiCG-eslWXt519gpSE2tHkXYftcgsv_qi3H2lTrMU6kncHm8UaOIfAFv57G4/exec";
    const target = new URL(WEB_APP_URL);
    const page = new URLSearchParams(window.location.search).get("page");

    if (["home", "website", "login", "register", "dashboard"].includes(page)) {
      target.searchParams.set("page", page);
    }

    document.getElementById("direct").href = target.href;

    // Buka Apps Script langsung di tab ini.
    window.location.replace(target.href);
  </script>
</body>
</html>
