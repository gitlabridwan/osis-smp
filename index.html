<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123e36">
  <meta name="description" content="Portal OSIS untuk informasi kegiatan, pengurus, berita, dan aspirasi siswa.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>OSIS | Satu Ruang Bersama</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background: #f6f8f7; color: #173f37; }
    .bar { display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding: 7px max(14px, env(safe-area-inset-right)) 7px max(14px, env(safe-area-inset-left)); background: #123e36; color: #fff; }
    .brand { font-size: 14px; font-weight: 750; letter-spacing: .08em; }
    .actions { display: flex; align-items: center; gap: 8px; }
    button, .direct { border: 1px solid #ffffff45; border-radius: 7px; padding: 6px 9px; background: transparent; color: inherit; font: inherit; font-size: 12px; line-height: 1.3; text-decoration: none; cursor: pointer; }
    button:hover, .direct:hover { background: #ffffff18; }
    :focus-visible { outline: 3px solid #f7cd72; outline-offset: 3px; }
    main { position: relative; flex: 1 1 auto; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .notice { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; padding: 28px; background: #f6f8f7; text-align: center; }
    .notice h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); }
    .notice p { max-width: 440px; margin: 0 auto; color: #536a64; line-height: 1.65; font-size: 14px; }
    .spinner { width: 32px; height: 32px; margin: 0 auto 6px; border: 3px solid #dce7e3; border-top-color: #123e36; border-radius: 50%; animation: spin .8s linear infinite; }
    .loading-note { position: fixed; bottom: 18px; left: 50%; z-index: 2; width: max-content; max-width: calc(100% - 32px); transform: translateX(-50%); padding: 12px 16px; border: 1px solid #dce7e3; border-radius: 12px; background: #fff; color: #173f37; box-shadow: 0 5px 24px #123e3618; font-size: 13px; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <header class="bar">
    <span class="brand">OSIS</span>
    <nav class="actions" aria-label="Bantuan akses" id="actions" hidden>
      <button type="button" id="reload">Muat ulang</button>
      <a class="direct" id="direct" target="_blank" rel="noopener noreferrer">Buka langsung ↗</a>
    </nav>
  </header>
  <main>
    <iframe id="osis-app" title="Website OSIS" allow="fullscreen" hidden></iframe>
    <section class="notice" id="notice" role="status" aria-live="polite">
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <h1 id="notice-title">Memuat website OSIS</h1>
      <p id="notice-description">Silakan tunggu sebentar.</p>
    </section>
    <noscript>
      <section class="notice">
        <h1>Aktifkan JavaScript</h1>
        <p>Website OSIS memerlukan JavaScript. Aktifkan melalui pengaturan browser, lalu muat ulang halaman ini.</p>
      </section>
    </noscript>
  </main>
  <p class="loading-note" id="slow-note" role="status" hidden>Halaman masih dimuat. Jika tetap kosong, pilih “Buka langsung”.</p>
  <script>
    "use strict";

    // SATU BAGIAN YANG PERLU DIISI:
    // Ganti teks di dalam tanda kutip dengan URL deployment Google Apps Script.
    // Gunakan URL Web App berakhiran /exec, bukan /dev atau URL editor.
    // Contoh: https://script.google.com/macros/s/ID_DEPLOYMENT_ANDA/exec
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxKRY-9NiCG-eslWXt519gpSE2tHkXYftcgsv_qi3H2lTrMU6kncHm8UaOIfAFv57G4/exec";

    (() => {
      const frame = document.getElementById("osis-app");
      const notice = document.getElementById("notice");
      const slowNote = document.getElementById("slow-note");
      let target;

      try {
        target = new URL(WEB_APP_URL.trim());
        if (target.protocol !== "https:" || target.hostname !== "script.google.com" ||
            !/^\/macros\/(?:u\/\d+\/|a\/[^/]+\/)?s\/[A-Za-z0-9_-]+\/exec\/?$/.test(target.pathname)) {
          throw new Error("URL Web App tidak valid.");
        }
      } catch {
        document.getElementById("spinner").hidden = true;
        document.getElementById("notice-title").textContent = "Website belum terhubung";
        document.getElementById("notice-description").textContent = "Pengurus perlu mengisi WEB_APP_URL di berkas index.html dengan tautan Web App Google Apps Script berakhiran /exec.";
        return;
      }

      // Teruskan hanya pilihan halaman yang didukung aplikasi.
      const page = new URLSearchParams(window.location.search).get("page");
      if (["home", "website", "login", "register", "dashboard"].includes(page)) {
        target.searchParams.set("page", page);
      }

      document.getElementById("direct").href = target.href;
      document.getElementById("actions").hidden = false;
      let timer;

      function loadApp() {
        window.clearTimeout(timer);
        notice.hidden = false;
        slowNote.hidden = true;
        frame.hidden = false;
        frame.src = target.href;
        timer = window.setTimeout(() => {
          // Iframe lintas domain tidak mengizinkan pemeriksaan isinya.
          // Beri akses langsung tanpa menganggap timeout sebagai kegagalan.
          notice.hidden = true;
          slowNote.hidden = false;
        }, 15000);
      }

      frame.addEventListener("load", () => {
        window.clearTimeout(timer);
        notice.hidden = true;
        slowNote.hidden = true;
      });
      document.getElementById("reload").addEventListener("click", loadApp);
      loadApp();
    })();
  </script>
</body>
</html>
